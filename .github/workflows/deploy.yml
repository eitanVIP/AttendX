# Deploys the site (Firebase Hosting) and the Firestore rules/indexes every
# time something lands on main. One-time setup: the repository secrets listed
# under `env:` below, plus GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT
# (keyless sign-in to Google, so no service-account key is needed) - see the README.
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one that has started.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job prove to Google who it is (no stored key)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # These are baked into the client bundle (Vite reads them at build
      # time), which is why they are needed here and not only at deploy.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      # Workload Identity Federation: Google trusts this repository's GitHub
      # token directly, so no service-account key is created or stored. It
      # exports GOOGLE_APPLICATION_CREDENTIALS, which firebase-tools picks up.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy hosting, Firestore rules and indexes
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@15.34.0 deploy --only hosting,firestore --project "$FIREBASE_PROJECT_ID" --non-interactive
